name: Fetch binary assets
on:
  push:
    paths: ['assets-manifest.tsv', '.github/workflows/fetch-assets.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify assets
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url sha; do
            [ -z "$path" ] && continue
            if [ -f "$path" ] && echo "$sha  $path" | sha256sum -c --quiet 2>/dev/null; then continue; fi
            mkdir -p "$(dirname "$path")"
            curl -fsSL --retry 3 -o "$path" "$url"
            echo "$sha  $path" | sha256sum -c --quiet
          done < assets-manifest.tsv
      - name: Commit assets
        run: |
          git config user.name "kre-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets
          git diff --cached --quiet || git commit -m "Add binary assets (verified sha256)"
          git push
